# 앞단 프록시(Cloudflare/호스트 nginx)가 넘긴 X-Forwarded-Proto 우선, 없으면 현재 scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # API proxy to Spring Boot
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;   # 백엔드가 https 인식 → same-origin 정상 판정 + Secure 쿠키
    }

    # 로그인·관리자 화면은 검색엔진 색인 제외
    location ^~ /login {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }

    location ^~ /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri /index.html;
    }

    # 홈
    location = / {
        try_files /index.html =404;
    }

    # 유효한 SPA 라우트만 index.html(또는 프리렌더된 경로별 index.html)로 200 응답.
    # 목록에 없는 경로는 아래 catch-all 에서 실제 404 로 처리된다.
    location ~ ^/(stock|disclosures|economic|macro|news|screener|compare|guide|board|about|contact|privacy|terms)(/|$) {
        try_files $uri $uri/ /index.html;
    }

    # 정적 자산은 그대로 서빙, 존재하지 않는 경로는 실제 HTTP 404
    location / {
        try_files $uri =404;
    }

    # 404 는 SPA 셸(noindex 박힌 404.html)을 404 상태로 내려 soft 404 를 방지한다.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
