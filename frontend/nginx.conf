# 앞단 프록시(Cloudflare/호스트 nginx)가 넘긴 X-Forwarded-Proto 우선, 없으면 현재 scheme
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Cloudflare 터널 뒤 80포트로 동작하므로, nginx 가 만드는 리디렉션이
    # http:// 절대주소로 나가 https→http 다운그레이드 체인이 생기는 것을 방지.
    absolute_redirect off;

    # ── gzip ── origin↔edge(Cloudflare) 구간 압축. 이미지·폰트 등 이미 압축된 포맷은 제외.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # ── 보안 헤더 ── server 레벨 기본값.
    # nginx 규칙상 자체 add_header 를 가진 하위 location 은 이 값을 상속하지 않으므로,
    # 그런 location(정적 자산·/login·/admin·/404.html)에는 아래에서 재선언한다.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API proxy to Spring Boot
    #
    # robots.txt 는 /api/ 를 막지 않는다 — SPA 본문이 전부 이 응답으로 그려지므로
    # 막으면 Google 렌더러가 XHR 를 못 가져와 렌더 결과가 빈 페이지가 된다.
    # 대신 JSON 응답 자체가 검색 결과에 노출되지 않도록 여기서 noindex 를 붙인다.
    # (X-Robots-Tag 는 해당 URL 에만 적용되며, 이 JSON 을 fetch 한 페이지에는 영향이 없다.)
    location /api/ {
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;   # 백엔드가 https 인식 → same-origin 정상 판정 + Secure 쿠키
    }

    # sitemap.xml 은 백엔드가 DB(게시된 가이드·게시글)를 읽어 동적 생성한다.
    # 관리자가 글을 게시하면 재배포 없이 즉시 반영된다.
    location = /sitemap.xml {
        proxy_pass http://backend:8080/api/sitemap.xml;
        proxy_set_header Host $host;
    }

    # 로그인·관리자 화면은 검색엔진 색인 제외.
    # try_files 의 마지막 인자는 내부 리디렉션이라 최종 응답이 다른 location 에서
    # 생성되어 add_header 가 사라진다. 셸을 이 location 안에서 직접 서빙(첫 인자)해야
    # X-Robots-Tag 가 실제로 붙는다.
    # (홈 index.html 이 아니라 app-shell.html 을 쓴다 — 홈 셸은 canonical 이
    #  https://jipyo.net/ 로 박혀 있어 이 화면들이 홈의 중복으로 보이게 된다.)
    location ^~ /login {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /app-shell.html =404;
    }

    location ^~ /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /app-shell.html =404;
    }

    # 홈
    location = / {
        try_files /index.html =404;
    }

    # 해시 파일명 정적 자산 — Vite 빌드 산출물(JS/CSS/이미지)은 전부 /assets/ 아래로 떨어지고
    # 빌드마다 파일명 해시가 바뀌므로 1년 immutable 캐시가 안전하다.
    # (favicon.svg 같은 루트의 비해시 자산은 여기 안 걸려 아래 catch-all 이 서빙 → 교체 시 반영됨.
    #  index.html 도 확장자가 없어 매칭되지 않아 항상 최신 셸을 받는다.)
    # (expires 지시어는 쓰지 않는다 — add_header Cache-Control 과 함께 쓰면 Cache-Control 이
    #  중복 출력되므로, immutable 을 담을 수 있는 add_header 하나로만 설정한다.)
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # 유효한 SPA 라우트만 프리렌더된 경로별 index.html(없으면 app-shell.html)로 200 응답.
    # 목록에 없는 경로는 아래 catch-all 에서 실제 404 로 처리된다.
    # 주의: $uri/ (디렉터리 매칭)를 쓰면 nginx 가 /disclosures → /disclosures/ 301 을
    # 만들어 sitemap·canonical(슬래시 없음)과 어긋난다 (Search Console "리디렉션이
    # 포함된 페이지"의 원인). 프리렌더 파일을 $uri/index.html 로 직접 서빙해 301 을 없앤다.
    #
    # 폴백이 /index.html(홈)이면 프리렌더 대상이 아닌 동적 경로(/stock/*, /board/*,
    # 아직 프리렌더되지 않은 신규 /guide/*)가 전부 canonical="https://jipyo.net/" 과
    # 홈 제목을 달고 나가 홈의 중복으로 취급된다. canonical 이 없는 app-shell.html 로
    # 폴백해 usePageMeta 가 런타임에 올바른 canonical 을 넣게 한다.
    location ~ ^/(stock|disclosures|economic|macro|news|screener|compare|guide|board|about|contact|privacy|terms)(/|$) {
        try_files $uri $uri/index.html /app-shell.html;
    }

    # 정적 자산은 그대로 서빙, 존재하지 않는 경로는 실제 HTTP 404
    location / {
        try_files $uri =404;
    }

    # SPA 폴백 셸. internal 이라 외부에서 /app-shell.html 을 직접 요청하면 404 이고
    # (색인될 별도 URL 이 생기지 않는다), 위 try_files 의 내부 리디렉션만 통과한다.
    location = /app-shell.html {
        internal;
    }

    # 404 는 SPA 셸(noindex 박힌 404.html)을 404 상태로 내려 soft 404 를 방지한다.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
