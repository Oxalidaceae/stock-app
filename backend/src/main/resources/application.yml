spring:
  application:
    name: stock-app

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockapp}
    username: ${DB_USERNAME:stockapp}
    password: ${DB_PASSWORD:stockapp}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: none   # RedisConfig에서 NoOpCacheManager 사용 — Jackson 직렬화 이슈로 임시 비활성

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      repositories:
        enabled: false   # Spring Data Redis Repository 스캐닝 비활성 (JPA 전용 프로젝트)

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized  # 익명: 단순 UP/DOWN, 내부망: 상세
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true

logging:
  level:
    com.stockapp: ${LOG_LEVEL:INFO}   # 로컬 디버깅 시 LOG_LEVEL=DEBUG 로 오버라이드
  file:
    name: ${LOG_DIR:/logs}/backend.log   # 콘솔(Dozzle) + 파일 동시 출력. docker는 호스트 ./logs 마운트로 재빌드해도 보존
  logback:
    rollingpolicy:
      max-file-size: 10MB        # 하루치가 10MB 넘으면 분할
      max-history: 30            # 30일(1달)치 보관 후 자동 삭제
      total-size-cap: 1GB        # 전체 로그 1GB 안전 상한

app:
  dart:
    api-key: ${DART_API_KEY:}
    base-url: https://opendart.fss.or.kr/api
  ecos:
    api-key: ${ECOS_API_KEY:}
    base-url: https://ecos.bok.or.kr/api
  jwt:
    secret: ${JWT_SECRET:default-dev-secret-change-in-production}
    expiration-ms: 86400000  # 24시간
  auth:
    secure-cookie: ${AUTH_COOKIE_SECURE:true}
  bootstrap-admin:
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}
