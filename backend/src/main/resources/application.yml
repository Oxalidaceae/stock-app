spring:
  application:
    name: stock-app

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stockapp}
    username: ${DB_USERNAME:stockapp}
    password: ${DB_PASSWORD:stockapp}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  cache:
    type: redis

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080

logging:
  level:
    com.stockapp: DEBUG

app:
  dart:
    api-key: ${DART_API_KEY}
    base-url: https://opendart.fss.or.kr/api
  ecos:
    api-key: ${ECOS_API_KEY}
    base-url: https://ecos.bok.or.kr/api
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000  # 24시간
