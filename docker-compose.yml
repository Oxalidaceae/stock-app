services:
  # ── PostgreSQL ─────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: stockapp-postgres
    restart: unless-stopped
    mem_limit: 2g
    # 세션 타임존을 KST로 고정 — collected_at/updated_at 의 now() 기본값이 KST로 저장되도록.
    # (이미 초기화된 볼륨은 TZ env 만으론 안 바뀌므로 -c timezone 으로 명시)
    command: ["postgres", "-c", "timezone=Asia/Seoul"]
    environment:
      TZ: Asia/Seoul
      POSTGRES_DB: ${DB_NAME:-stockapp}
      POSTGRES_USER: ${DB_USERNAME:-stockapp}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockapp}
    # 호스트 포트 미노출 — 내부 docker 네트워크(postgres:5432)로만 접근.
    # 로컬에서 직접 붙어야 하면 아래 주석 해제:
    #   ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-stockapp}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ── Spring Boot Backend ────────────────────────
  backend:
    build: ./backend
    container_name: stockapp-backend
    restart: unless-stopped
    mem_limit: 2g       # JVM 힙은 Dockerfile의 -Xmx1280m 으로 명시 캡 (이 한도 안에 metaspace·오버헤드까지 수용)
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./logs:/logs       # 로그 영속화 (재빌드해도 보존)
    environment:
      TZ: Asia/Seoul
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stockapp}
      DB_USERNAME: ${DB_USERNAME:-stockapp}
      DB_PASSWORD: ${DB_PASSWORD:-stockapp}
      DART_API_KEY: ${DART_API_KEY}
      ECOS_API_KEY: ${ECOS_API_KEY}
      # :? — .env 에 없으면 기동 자체를 거부. 기본값 fallback 을 두면 저장소에 공개된
      # 시크릿으로 조용히 떠서 관리자 토큰 위조가 가능해진다.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 미설정 — .env 에 32자 이상 랜덤값을 넣으세요 (.env.example 참고)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-https://jipyo.net,https://www.jipyo.net}
      REACTION_RATE_LIMIT_PER_MINUTE: ${REACTION_RATE_LIMIT_PER_MINUTE:-30}
      # :? — JWT_SECRET 과 동일. 미설정 시 기동 거부. 공개된 기본 salt 로 조용히 뜨면
      # 저장된 IP 해시에서 원본 IP 를 역산할 수 있다(IPv4 전수 계산 가능).
      REACTION_IP_SALT: ${REACTION_IP_SALT:?REACTION_IP_SALT 미설정 — .env 에 임의 랜덤값을 넣으세요 (.env.example 참고)}
    depends_on:
      postgres:
        condition: service_healthy

  # ── React Frontend (nginx) ────────────────────
  frontend:
    build: ./frontend
    container_name: stockapp-frontend
    restart: unless-stopped
    mem_limit: 128m
    # 터널을 컨테이너로 띄우면(cloudflared 서비스) 내부망 frontend:80 으로 직접 붙으므로
    # 이 포트 노출은 필수가 아니다. 다만 서버에서 `curl localhost:3000` 으로 프런트만
    # 따로 점검할 때 유용해 loopback 바인딩으로 남겨둔다(외부 노출 아님).
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      - backend

  # ── Cloudflare Tunnel ──────────────────────────
  # 리눅스 호스트에서는 cloudflared 를 윈도우 서비스 대신 컨테이너로 띄운다.
  # 이러면 "터널은 부팅 시 뜨는데 Docker 는 로그인해야 뜬다" 는 윈도우 특유의 함정이 사라지고,
  # 스택 전체가 docker 하나로 자동 복구된다.
  #
  # 활성화: .env 에 COMPOSE_PROFILES=tunnel 과 TUNNEL_TOKEN 을 넣는다(운영 서버에서만).
  #         프로필로 감싼 이유 — 로컬 개발에서는 터널이 필요 없기 때문.
  # 대시보드: Public hostname 의 Service 를 http://localhost:3000 → http://frontend:80 으로 변경.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: stockapp-cloudflared
    restart: unless-stopped
    mem_limit: 128m
    # 토큰은 command 대신 환경변수로 준다 — command 에 두면 `docker ps` 출력에 그대로 노출된다.
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TZ: Asia/Seoul
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - frontend
    profiles:
      - tunnel

  # ── Python Collector (일회성 초기화 — 수동 실행) ──────────
  collector-init:
    build: ./collector
    container_name: stockapp-collector-init
    command: ["--init"]
    mem_limit: 2g
    volumes:
      - ./logs:/logs       # 로그 영속화 (재빌드해도 보존)
    environment:
      TZ: Asia/Seoul
      DART_API_KEY: ${DART_API_KEY}
      ECOS_API_KEY: ${ECOS_API_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stockapp}
      DB_USERNAME: ${DB_USERNAME:-stockapp}
      DB_PASSWORD: ${DB_PASSWORD:-stockapp}
      # 수집 연속 실패 시 알림 (비워두면 알림 없음). CHAT_ID 는 텔레그램에서만 필요.
      COLLECTOR_ALERT_WEBHOOK: ${COLLECTOR_ALERT_WEBHOOK:-}
      COLLECTOR_ALERT_CHAT_ID: ${COLLECTOR_ALERT_CHAT_ID:-}
      COLLECTOR_ALERT_THRESHOLD: ${COLLECTOR_ALERT_THRESHOLD:-3}
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - init

  # ── Python Collector (스케줄 데몬 — 매시간 스태거 + 주가 16:00 + 재무제표 원본 일 02:00) ────
  collector-daemon:
    build: ./collector
    container_name: stockapp-collector-daemon
    command: ["--daemon"]
    restart: unless-stopped
    mem_limit: 1.5g
    volumes:
      - ./logs:/logs       # 로그 영속화 (재빌드해도 보존)
    environment:
      TZ: Asia/Seoul
      DART_API_KEY: ${DART_API_KEY}
      ECOS_API_KEY: ${ECOS_API_KEY}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stockapp}
      DB_USERNAME: ${DB_USERNAME:-stockapp}
      DB_PASSWORD: ${DB_PASSWORD:-stockapp}
      # 수집 연속 실패 시 알림 (비워두면 알림 없음). CHAT_ID 는 텔레그램에서만 필요.
      COLLECTOR_ALERT_WEBHOOK: ${COLLECTOR_ALERT_WEBHOOK:-}
      COLLECTOR_ALERT_CHAT_ID: ${COLLECTOR_ALERT_CHAT_ID:-}
      COLLECTOR_ALERT_THRESHOLD: ${COLLECTOR_ALERT_THRESHOLD:-3}
    depends_on:
      postgres:
        condition: service_healthy

  # ── DB 자동 백업 ────────────────────────────────
  # postgres 이미지의 pg_dump 로 매일 압축 백업 → BACKUP_DIR 로 저장, 오래된 파일 정리.
  # 스택의 일부라 docker compose up 만 하면 자동 실행(윈도우 작업 스케줄러 불필요).
  # 오프사이트 보관: .env 에 BACKUP_DIR=<OneDrive/Drive 동기화 폴더> 지정.
  backup:
    image: postgres:16-alpine
    container_name: stockapp-backup
    restart: unless-stopped
    mem_limit: 256m
    entrypoint: ["sh", "/backup-loop.sh"]
    environment:
      TZ: Asia/Seoul
      PGHOST: postgres
      PGUSER: ${DB_USERNAME:-stockapp}
      PGPASSWORD: ${DB_PASSWORD:-stockapp}
      PGDATABASE: ${DB_NAME:-stockapp}
      BACKUP_HOUR: ${BACKUP_HOUR:-4}          # 매일 이 시각(KST)에 백업
      KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}      # 보관 일수
    volumes:
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy

  # ── Dozzle (컨테이너 로그 뷰어) ──────────────────
  # 접속: SSH 터널 후 http://localhost:8081
  #   ssh -L 8081:localhost:8081 <user>@<host>
  dozzle:
    image: amir20/dozzle:latest
    container_name: stockapp-dozzle
    restart: unless-stopped
    mem_limit: 128m
    environment:
      DOZZLE_NO_ANALYTICS: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  pgdata:
